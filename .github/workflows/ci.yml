name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: npm run check

  deterministic-cbor-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        seed: [1831565813, 305419896, 3735928559]
    env:
      CBOR_FUZZ_SEED: ${{ matrix.seed }}
      CBOR_FUZZ_ITERATIONS: ${{ github.event_name == 'schedule' && '250000' || '25000' }}
      CBOR_FUZZ_MAX_BYTES: 512
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
      - run: npm run fuzz:cbor
